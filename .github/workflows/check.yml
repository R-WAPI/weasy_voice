name: Check Flutter package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/weasy-flutter"
          git -C "$RUNNER_TEMP/weasy-flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/weasy-flutter" fetch --depth 1 origin refs/tags/3.47.9:refs/tags/3.47.9
          git -C "$RUNNER_TEMP/weasy-flutter" checkout -b stable refs/tags/3.47.9
          test "$(git -C "$RUNNER_TEMP/weasy-flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/weasy-flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib tests
      - run: dart run tests/core_check.dart
      - name: Check PCM onset gate
        run: |
          javac -d /tmp/weasy-onset android/src/main/java/hu/weasy/voice/SpeechOnset.java tests/SpeechOnsetCheck.java
          java -cp /tmp/weasy-onset hu.weasy.voice.SpeechOnsetCheck
