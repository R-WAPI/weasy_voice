name: Check Flutter package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/weasy-flutter"
          git -C "$RUNNER_TEMP/weasy-flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/weasy-flutter" fetch --depth 1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          git -C "$RUNNER_TEMP/weasy-flutter" checkout --detach FETCH_HEAD
          echo "$RUNNER_TEMP/weasy-flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos lib tests
      - run: dart run tests/core_check.dart
